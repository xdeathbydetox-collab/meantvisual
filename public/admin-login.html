<!doctype html>
<html lang="ru">

<head>
    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width,initial-scale=1"
    >

    <title>MEANT SHOP — Вход администратора</title>

    <style>
        :root {
            --bg: #060606;
            --card: #101010;
            --line: #2a2a2a;
            --yellow: #ffd21a;
            --yellow2: #ffb900;
            --text: #f7f7f7;
            --muted: #8b8b8b;
            --danger: #ff6868;
            --success: #61e58a;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
        }

        body {
            min-height: 100vh;

            background:
                radial-gradient(
                    circle at 50% -10%,
                    #2b2400 0,
                    #0b0b0b 34%,
                    #050505 75%
                );

            color: var(--text);

            font-family:
                Inter,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
        }

        .wrap {
            width: 100%;
            max-width: 560px;

            margin: 0 auto;

            padding: 22px;
        }

        /* =====================================================
           HEADER
        ===================================================== */

        .top {
            height: 68px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 20px;

            background: #111;

            border: 1px solid var(--line);

            border-radius: 22px;
        }

        .logo {
            font-size: 19px;
            font-weight: 950;

            letter-spacing: .08em;
        }

        .logo b {
            color: var(--yellow);
        }

        .back {
            color: #aaa;

            text-decoration: none;

            font-size: 13px;

            transition: .2s;
        }

        .back:hover {
            color: white;
        }

        /* =====================================================
           CARD
        ===================================================== */

        .card {
            margin-top: 55px;

            padding: 30px;

            background:
                linear-gradient(
                    180deg,
                    #151515,
                    #0c0c0c
                );

            border: 1px solid var(--line);

            border-radius: 28px;

            box-shadow:
                0 25px 80px #0009;
        }

        .badge {
            width: fit-content;

            margin: 0 auto;

            padding: 7px 12px;

            border:
                1px solid
                rgba(255, 210, 26, .35);

            border-radius: 999px;

            color: var(--yellow);

            background:
                rgba(255, 210, 26, .06);

            font-size: 10px;

            font-weight: 900;

            letter-spacing: .16em;
        }

        .title {
            text-align: center;

            font-size: 38px;

            line-height: 1;

            margin: 18px 0 10px;
        }

        .subtitle {
            text-align: center;

            color: var(--muted);

            font-size: 14px;

            line-height: 1.55;

            margin-bottom: 28px;
        }

        /* =====================================================
           FORM
        ===================================================== */

        .field {
            margin-bottom: 16px;
        }

        .field label {
            display: block;

            margin-bottom: 7px;

            color: #777;

            font-size: 11px;

            font-weight: 800;

            letter-spacing: .08em;

            text-transform: uppercase;
        }

        .field input {
            width: 100%;

            padding: 14px;

            border:
                1px solid
                #303030;

            border-radius: 13px;

            background: #0c0c0c;

            color: white;

            font: inherit;

            outline: none;

            transition: .2s;
        }

        .field input::placeholder {
            color: #555;
        }

        .field input:focus {
            border-color: var(--yellow);

            box-shadow:
                0 0 0 3px
                rgba(255, 210, 26, .06);
        }

        /* =====================================================
           BUTTON
        ===================================================== */

        .submit {
            width: 100%;

            margin-top: 8px;

            padding: 15px;

            border: 0;

            border-radius: 14px;

            background:
                linear-gradient(
                    180deg,
                    var(--yellow),
                    var(--yellow2)
                );

            color: #050505;

            font: inherit;

            font-weight: 950;

            cursor: pointer;

            transition: .2s;
        }

        .submit:hover {
            transform: translateY(-1px);

            box-shadow:
                0 10px 30px
                rgba(255, 193, 0, .2);
        }

        .submit:active {
            transform: translateY(0);
        }

        .submit:disabled {
            opacity: .55;

            cursor: not-allowed;

            transform: none;

            box-shadow: none;
        }

        /* =====================================================
           MESSAGE
        ===================================================== */

        .message {
            min-height: 22px;

            margin-top: 15px;

            text-align: center;

            font-size: 12px;

            line-height: 1.5;
        }

        .message.error {
            color: var(--danger);
        }

        .message.success {
            color: var(--success);
        }

        /* =====================================================
           STATUS
        ===================================================== */

        .status {
            margin-top: 20px;

            padding: 13px 15px;

            border:
                1px solid
                #222;

            border-radius: 14px;

            background: #0a0a0a;

            color: #777;

            font-size: 11px;

            line-height: 1.5;

            text-align: center;
        }

        /* =====================================================
           WARNING
        ===================================================== */

        .warning {
            margin-top: 22px;

            padding: 15px;

            border:
                1px solid
                rgba(255, 210, 26, .15);

            border-radius: 14px;

            background:
                rgba(255, 210, 26, .035);

            color: #aaa;

            font-size: 11px;

            line-height: 1.55;
        }

        .warning strong {
            color: #ddd;
        }

        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 500px) {

            .wrap {
                padding: 14px;
            }

            .top {
                height: 62px;

                padding: 0 16px;

                border-radius: 18px;
            }

            .card {
                margin-top: 30px;

                padding: 22px;

                border-radius: 24px;
            }

            .title {
                font-size: 32px;
            }

            .subtitle {
                font-size: 13px;
            }
        }
    </style>

</head>

<body>

<div class="wrap">

    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="top">

        <div class="logo">
            MEANT <b>SHOP</b>
        </div>

        <a
            class="back"
            href="index.html"
        >
            ← Назад
        </a>

    </header>


    <!-- =====================================================
         LOGIN CARD
    ====================================================== -->

    <main class="card">

        <div class="badge">
            ADMIN SYSTEM
        </div>


        <h1 class="title">
            ВХОД
        </h1>


        <div class="subtitle">

            Вход в административную
            систему MEANT SHOP.

        </div>


        <!-- =================================================
             FORM
        ================================================== -->

        <form id="loginForm">

            <!-- USERNAME -->

            <div class="field">

                <label for="username">
                    Логин администратора
                </label>

                <input
                    id="username"
                    name="username"
                    type="text"
                    autocomplete="username"
                    minlength="3"
                    maxlength="32"
                    placeholder="Например: detox"
                    required
                >

            </div>


            <!-- PASSWORD -->

            <div class="field">

                <label for="password">
                    Пароль
                </label>

                <input
                    id="password"
                    name="password"
                    type="password"
                    autocomplete="current-password"
                    minlength="8"
                    maxlength="128"
                    placeholder="Введите пароль"
                    required
                >

            </div>


            <!-- SUBMIT -->

            <button
                id="submit"
                class="submit"
                type="submit"
            >
                Войти в админку
            </button>

        </form>


        <!-- MESSAGE -->

        <div
            id="message"
            class="message"
        ></div>


        <!-- STATUS -->

        <div
            id="status"
            class="status"
        >
            Проверка авторизации...
        </div>


        <!-- WARNING -->

        <div class="warning">

            <strong>Важно:</strong>

            это отдельная административная
            авторизация. Она использует
            admin_sessions и не использует
            обычную пользовательскую сессию.

        </div>

    </main>

</div>


<script>

/* =========================================================
   ELEMENTS
========================================================= */

const loginForm =
    document.getElementById(
        "loginForm"
    );


const usernameInput =
    document.getElementById(
        "username"
    );


const passwordInput =
    document.getElementById(
        "password"
    );


const submitButton =
    document.getElementById(
        "submit"
    );


const message =
    document.getElementById(
        "message"
    );


const status =
    document.getElementById(
        "status"
    );


/* =========================================================
   MESSAGE
========================================================= */

function showMessage(
    text,
    type = "error"
) {

    message.textContent =
        text;

    message.className =
        "message " + type;

}


/* =========================================================
   STATUS
========================================================= */

function showStatus(text) {

    status.textContent =
        text;

}


/* =========================================================
   CHECK EXISTING ADMIN SESSION
========================================================= */

async function checkAdminSession() {

    try {

        showStatus(
            "Проверяем существующую сессию..."
        );


        const response =
            await fetch(
                "/api/admin/me",
                {
                    method: "GET",

                    headers: {
                        "Accept":
                            "application/json"
                    },

                    credentials:
                        "include"
                }
            );


        let data = null;


        try {

            data =
                await response.json();

        } catch {

            data = null;

        }


        if (
            response.ok &&
            data?.success &&
            data?.authenticated &&
            data?.admin
        ) {

            showStatus(
                "Вы уже авторизованы как " +
                data.admin.username
            );


            /*
             * Небольшая задержка,
             * чтобы пользователь увидел сообщение.
             */

            setTimeout(
                () => {

                    window.location.href =
                        "admin-panel.html";

                },
                500
            );


            return;

        }


        showStatus(
            "Введите данные администратора"
        );

    } catch (error) {

        console.error(
            "ADMIN SESSION CHECK:",
            error
        );


        showStatus(
            "Введите данные администратора"
        );

    }

}


/* =========================================================
   LOGIN
========================================================= */

loginForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        showMessage("");


        const username =
            usernameInput.value.trim();


        const password =
            passwordInput.value;


        /* ---------------------------------------------
           VALIDATION
        --------------------------------------------- */

        if (!username) {

            showMessage(
                "Введите логин администратора"
            );

            usernameInput.focus();

            return;

        }


        if (!/^[a-zA-Z0-9_-]{3,32}$/.test(username)) {

            showMessage(
                "Недопустимый формат логина"
            );

            usernameInput.focus();

            return;

        }


        if (!password) {

            showMessage(
                "Введите пароль"
            );

            passwordInput.focus();

            return;

        }


        if (password.length < 8) {

            showMessage(
                "Пароль должен быть не короче 8 символов"
            );

            passwordInput.focus();

            return;

        }


        /* ---------------------------------------------
           DISABLE BUTTON
        --------------------------------------------- */

        submitButton.disabled =
            true;

        submitButton.textContent =
            "Вход...";


        showStatus(
            "Проверяем данные..."
        );


        try {

            /* =========================================
               ADMIN LOGIN
            ========================================= */

            const response =
                await fetch(
                    "/api/admin/login",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json",

                            "Accept":
                                "application/json"
                        },

                        credentials:
                            "include",

                        body:
                            JSON.stringify({
                                username,
                                password
                            })
                    }
                );


            let data;


            try {

                data =
                    await response.json();

            } catch {

                throw new Error(
                    "Сервер вернул некорректный ответ"
                );

            }


            /* =========================================
               LOGIN ERROR
            ========================================= */

            if (!response.ok) {

                throw new Error(
                    data?.error ||
                    "Неверный логин или пароль"
                );

            }


            /* =========================================
               LOGIN SUCCESS
            ========================================= */

            if (
                !data?.success ||
                !data?.authenticated
            ) {

                throw new Error(
                    data?.error ||
                    "Не удалось авторизоваться"
                );

            }


            const admin =
                data.admin;


            showMessage(
                "Вход выполнен. Добро пожаловать, " +
                (admin?.username || username) +
                ".",
                "success"
            );


            showStatus(
                "Административная сессия создана"
            );


            /* =========================================
               VERIFY SESSION
            ========================================= */

            const meResponse =
                await fetch(
                    "/api/admin/me",
                    {
                        method: "GET",

                        headers: {
                            "Accept":
                                "application/json"
                        },

                        credentials:
                            "include"
                    }
                );


            let meData;


            try {

                meData =
                    await meResponse.json();

            } catch {

                throw new Error(
                    "Не удалось проверить административную сессию"
                );

            }


            if (
                !meResponse.ok ||
                !meData?.success ||
                !meData?.authenticated
            ) {

                throw new Error(
                    meData?.error ||
                    "Сессия администратора не была создана"
                );

            }


            /* =========================================
               REDIRECT
            ========================================= */

            setTimeout(
                () => {

                    window.location.href =
                        "admin-panel.html";

                },
                500
            );


        } catch (error) {

            console.error(
                "ADMIN LOGIN:",
                error
            );


            showMessage(
                error?.message ||
                "Ошибка входа"
            );


            showStatus(
                "Авторизация не выполнена"
            );

        } finally {

            submitButton.disabled =
                false;

            submitButton.textContent =
                "Войти в админку";

        }

    }
);


/* =========================================================
   START
========================================================= */

checkAdminSession();

</script>

</body>

</html>

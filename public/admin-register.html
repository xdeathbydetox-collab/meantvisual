<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MEANT SHOP — Admin Register</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #070707;
            color: #f7f7f7;
            font-family: Arial, Helvetica, sans-serif;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 24px;
        }

        .card {
            width: 100%;
            max-width: 620px;

            background: #111;
            border: 1px solid #292929;
            border-radius: 28px;

            padding: 44px;
        }

        .logo {
            font-size: 38px;
            font-weight: 900;
            margin-bottom: 35px;
        }

        .logo span {
            color: #ffd21a;
        }

        h1 {
            font-size: 42px;
            margin: 0 0 12px;
        }

        .subtitle {
            color: #909090;
            font-size: 19px;
            margin-bottom: 35px;
        }

        label {
            display: block;
            margin: 22px 0 9px;
            font-size: 17px;
            color: #ddd;
        }

        input,
        select {
            width: 100%;
            height: 58px;

            border: 1px solid #333;
            border-radius: 15px;

            background: #161616;
            color: white;

            padding: 0 18px;
            font-size: 17px;
            outline: none;
        }

        input:focus,
        select:focus {
            border-color: #ffd21a;
        }

        select {
            cursor: pointer;
        }

        button {
            width: 100%;
            height: 60px;

            margin-top: 30px;

            border: 0;
            border-radius: 15px;

            background: #ffd21a;
            color: #080808;

            font-size: 19px;
            font-weight: 800;

            cursor: pointer;
        }

        button:hover {
            background: #ffdf4d;
        }

        button:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        .message {
            margin-top: 20px;
            padding: 15px;
            border-radius: 12px;

            display: none;

            font-size: 16px;
            line-height: 1.4;
        }

        .error {
            display: block;
            background: rgba(255, 77, 77, .12);
            border: 1px solid #ff4d4d;
            color: #ff6b6b;
        }

        .success {
            display: block;
            background: rgba(70, 220, 120, .1);
            border: 1px solid #46dc78;
            color: #46dc78;
        }

        .back {
            display: block;
            text-align: center;

            margin-top: 22px;

            color: #909090;
            text-decoration: none;
        }

        .back:hover {
            color: #ffd21a;
        }

        @media (max-width: 600px) {
            body {
                padding: 12px;
            }

            .card {
                padding: 28px 22px;
                border-radius: 22px;
            }

            h1 {
                font-size: 32px;
            }

            .logo {
                font-size: 31px;
            }
        }
    </style>
</head>

<body>

<div class="card">

    <div class="logo">
        MEANT <span>SHOP</span>
    </div>

    <h1>Регистрация администратора</h1>

    <div class="subtitle">
        Создание администратора MEANT SHOP
    </div>

    <form id="registerForm">

        <label for="username">
            Логин
        </label>

        <input
            id="username"
            type="text"
            placeholder="detox"
            autocomplete="username"
            required
        >

        <label for="password">
            Пароль
        </label>

        <input
            id="password"
            type="password"
            placeholder="Минимум 8 символов"
            autocomplete="new-password"
            required
        >

        <label for="role">
            Роль
        </label>

        <select id="role">
            <option value="OWNER">OWNER</option>
            <option value="ADMIN">ADMIN</option>
        </select>

        <label for="registerKey">
            Ключ регистрации
        </label>

        <input
            id="registerKey"
            type="password"
            placeholder="ADMIN_REGISTER_KEY"
            autocomplete="off"
            required
        >

        <button
            id="registerButton"
            type="submit"
        >
            Зарегистрировать аккаунт
        </button>

    </form>

    <div
        id="message"
        class="message"
    ></div>

    <a
        href="/admin-panel.html"
        class="back"
    >
        ← Вернуться в админ-панель
    </a>

</div>


<script>

const form =
    document.getElementById("registerForm");

const button =
    document.getElementById("registerButton");

const message =
    document.getElementById("message");


function showMessage(text, type) {

    message.textContent = text;

    message.className =
        "message " + type;

}


form.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();

        button.disabled = true;

        button.textContent =
            "Регистрация...";

        message.className =
            "message";

        message.textContent = "";


        const username =
            document
                .getElementById("username")
                .value
                .trim();


        const password =
            document
                .getElementById("password")
                .value;


        const role =
            document
                .getElementById("role")
                .value;


        const registerKey =
            document
                .getElementById("registerKey")
                .value;


        try {

            const response =
                await fetch(
                    "/api/admin/register",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        credentials: "include",

                        body: JSON.stringify({
                            username,
                            password,
                            role,
                            registerKey
                        })
                    }
                );


            const data =
                await response.json();


            if (!response.ok || !data.success) {

                throw new Error(
                    data.error ||
                    "Не удалось зарегистрировать администратора"
                );

            }


            showMessage(
                "Администратор " +
                data.admin.username +
                " успешно создан с ролью " +
                data.admin.role +
                ". Теперь можно войти в админ-панель.",
                "success"
            );


            form.reset();


            setTimeout(
                () => {
                    window.location.href =
                        "/admin-panel.html";
                },
                1500
            );


        } catch (error) {

            console.error(error);

            showMessage(
                error.message ||
                "Ошибка регистрации",
                "error"
            );

        } finally {

            button.disabled = false;

            button.textContent =
                "Зарегистрировать аккаунт";

        }

    }
);

</script>

</body>
</html>

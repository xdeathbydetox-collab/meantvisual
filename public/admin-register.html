<!doctype html>
<html lang="ru">

<head>

<meta charset="utf-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1"
>

<title>MEANT SHOP — Регистрация администратора</title>

<style>

:root {
    --bg: #060606;
    --card: #101010;
    --line: #2a2a2a;
    --yellow: #ffd21a;
    --text: #f7f7f7;
    --muted: #8b8b8b;
    --danger: #ff6868;
    --success: #61e58a;
}

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    min-height: 100vh;

    background:
        radial-gradient(
            circle at 50% -10%,
            #2b2400 0,
            #0b0b0b 34%,
            #050505 75%
        );

    color: var(--text);

    font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

}

.wrap {

    width: 100%;

    max-width: 560px;

    margin: 0 auto;

    padding: 22px;

}

.top {

    height: 68px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 0 20px;

    background: #111;

    border:
        1px solid
        var(--line);

    border-radius: 22px;

}

.logo {

    font-size: 19px;

    font-weight: 950;

    letter-spacing: .08em;

}

.logo b {

    color:
        var(--yellow);

}

.back {

    color: #aaa;

    text-decoration: none;

    font-size: 13px;

}

.card {

    margin-top: 55px;

    padding: 30px;

    background:
        linear-gradient(
            180deg,
            #151515,
            #0c0c0c
        );

    border:
        1px solid
        var(--line);

    border-radius: 28px;

    box-shadow:
        0 25px 80px
        #0009;

}

.badge {

    width: fit-content;

    margin: 0 auto;

    padding: 7px 12px;

    border:
        1px solid
        rgba(255,210,26,.35);

    border-radius: 999px;

    color:
        var(--yellow);

    background:
        rgba(255,210,26,.06);

    font-size: 10px;

    font-weight: 900;

    letter-spacing: .16em;

}

.title {

    text-align: center;

    font-size: 38px;

    line-height: 1;

    margin: 18px 0 10px;

}

.subtitle {

    text-align: center;

    color:
        var(--muted);

    font-size: 14px;

    line-height: 1.55;

    margin-bottom: 28px;

}

.field {

    margin-bottom: 15px;

}

.field label {

    display: block;

    margin-bottom: 7px;

    color: #777;

    font-size: 11px;

    font-weight: 800;

    letter-spacing: .08em;

    text-transform: uppercase;

}

.field input,
.field select {

    width: 100%;

    padding: 14px;

    border:
        1px solid
        #303030;

    border-radius: 13px;

    background:
        #0c0c0c;

    color: white;

    font: inherit;

    outline: none;

}

.field input:focus,
.field select:focus {

    border-color:
        var(--yellow);

}

.field select {

    cursor: pointer;

}

.field select option {

    background: #111;

    color: white;

}

.submit {

    width: 100%;

    margin-top: 8px;

    padding: 15px;

    border: 0;

    border-radius: 14px;

    background:
        var(--yellow);

    color: #050505;

    font: inherit;

    font-weight: 950;

    cursor: pointer;

    transition: .2s;

}

.submit:hover {

    transform:
        translateY(-1px);

    box-shadow:
        0 10px 30px
        rgba(255,193,0,.2);

}

.submit:disabled {

    opacity: .55;

    cursor:
        not-allowed;

    transform: none;

}

.message {

    min-height: 22px;

    margin-top: 15px;

    text-align: center;

    font-size: 12px;

}

.message.error {

    color:
        var(--danger);

}

.message.success {

    color:
        var(--success);

}

.warning {

    margin-top: 22px;

    padding: 15px;

    border:
        1px solid
        rgba(255,210,26,.15);

    border-radius: 14px;

    background:
        rgba(255,210,26,.035);

    color:
        #aaa;

    font-size: 11px;

    line-height: 1.55;

}

@media (max-width: 500px) {

    .card {

        margin-top: 30px;

        padding: 22px;

    }

    .title {

        font-size: 32px;

    }

}

</style>

</head>

<body>

<div class="wrap">


    <header class="top">

        <div class="logo">
            MEANT <b>SHOP</b>
        </div>

        <a
            class="back"
            href="index.html"
        >
            ← Назад
        </a>

    </header>


    <main class="card">


        <div class="badge">
            ADMIN SYSTEM
        </div>


        <h1 class="title">
            СОЗДАТЬ АДМИНА
        </h1>


        <div class="subtitle">

            Создание отдельного
            административного аккаунта MEANT SHOP.

        </div>


        <form id="form">


            <!-- USERNAME -->

            <div class="field">

                <label>
                    Логин администратора
                </label>

                <input
                    id="username"
                    type="text"
                    autocomplete="username"
                    minlength="3"
                    maxlength="32"
                    placeholder="Например: admin"
                    required
                >

            </div>


            <!-- PASSWORD -->

            <div class="field">

                <label>
                    Пароль
                </label>

                <input
                    id="password"
                    type="password"
                    autocomplete="new-password"
                    minlength="8"
                    maxlength="128"
                    placeholder="Минимум 8 символов"
                    required
                >

            </div>


            <!-- CONFIRM -->

            <div class="field">

                <label>
                    Повторите пароль
                </label>

                <input
                    id="confirm"
                    type="password"
                    autocomplete="new-password"
                    minlength="8"
                    maxlength="128"
                    placeholder="Повторите пароль"
                    required
                >

            </div>


            <!-- ROLE -->

            <div class="field">

                <label>
                    Роль
                </label>

                <select id="role">

                    <option value="ADMIN">
                        ADMIN
                    </option>

                    <option value="OWNER">
                        OWNER
                    </option>

                </select>

            </div>


            <!-- REGISTER KEY -->

            <div class="field">

                <label>
                    Ключ регистрации
                </label>

                <input
                    id="registerKey"
                    type="password"
                    autocomplete="off"
                    placeholder="ADMIN_REGISTER_KEY"
                    required
                >

            </div>


            <button
                class="submit"
                id="submit"
                type="submit"
            >
                Создать администратора
            </button>


        </form>


        <div
            class="message"
            id="message"
        ></div>


        <div class="warning">

            <strong>
                Важно:
            </strong>

            эта регистрация полностью отдельна
            от обычных пользователей MEANT SHOP.
            Она не использует обычный auth.js,
            accounts, credentials или sessions.

        </div>


    </main>

</div>


<script>

const form =
    document.getElementById(
        "form"
    );


const usernameInput =
    document.getElementById(
        "username"
    );


const passwordInput =
    document.getElementById(
        "password"
    );


const confirmInput =
    document.getElementById(
        "confirm"
    );


const roleInput =
    document.getElementById(
        "role"
    );


const registerKeyInput =
    document.getElementById(
        "registerKey"
    );


const submit =
    document.getElementById(
        "submit"
    );


const message =
    document.getElementById(
        "message"
    );


function showMessage(
    text,
    type = "error"
) {

    message.textContent =
        text;

    message.className =
        "message " + type;

}


form.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        showMessage("");


        const username =
            usernameInput.value.trim();


        const password =
            passwordInput.value;


        const confirm =
            confirmInput.value;


        const role =
            roleInput.value;


        const registerKey =
            registerKeyInput.value;


        /* ---------------------------------------------
           VALIDATION
        --------------------------------------------- */

        if (!username) {

            showMessage(
                "Введите логин администратора"
            );

            return;

        }


        if (
            !/^[a-zA-Z0-9_-]{3,32}$/
                .test(username)
        ) {

            showMessage(
                "Логин должен содержать от 3 до 32 символов: латинские буквы, цифры, _ или -"
            );

            return;

        }


        if (password.length < 8) {

            showMessage(
                "Пароль должен быть не короче 8 символов"
            );

            return;

        }


        if (password !== confirm) {

            showMessage(
                "Пароли не совпадают"
            );

            return;

        }


        if (!registerKey) {

            showMessage(
                "Введите ключ регистрации"
            );

            return;

        }


        submit.disabled =
            true;

        submit.textContent =
            "Создание...";


        try {

            const response =
                await fetch(
                    "/api/admin/register",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json",

                            "Accept":
                                "application/json"
                        },

                        credentials:
                            "include",

                        body:
                            JSON.stringify({
                                username,
                                password,
                                role,
                                registerKey
                            })
                    }
                );


            let data;


            try {

                data =
                    await response.json();

            } catch {

                throw new Error(
                    "Сервер вернул некорректный ответ"
                );

            }


            if (!response.ok) {

                throw new Error(
                    data?.error ||
                    "Ошибка регистрации"
                );

            }


            showMessage(
                "Администратор успешно создан",
                "success"
            );


            form.reset();


        } catch (error) {

            console.error(
                "ADMIN REGISTER:",
                error
            );


            showMessage(
                error?.message ||
                "Произошла ошибка"
            );

        } finally {

            submit.disabled =
                false;

            submit.textContent =
                "Создать администратора";

        }

    }
);

</script>

</body>

</html>

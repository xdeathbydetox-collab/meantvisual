<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>MEANT SHOP — Профиль</title>

<style>
:root{
    --bg:#070707;
    --card:#111;
    --card2:#161616;
    --line:#292929;
    --yellow:#ffd21a;
    --yellow2:#ffb900;
    --text:#f7f7f7;
    --muted:#909090;
    --danger:#ff4d4d;
}

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    min-height:100%;
}

body{
    background:
        radial-gradient(
            circle at 50% -10%,
            #292100 0,
            #0b0b0b 32%,
            #070707 70%
        );
    color:var(--text);
    font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}

a{
    color:inherit;
    text-decoration:none;
}

button{
    font-family:inherit;
}

.wrap{
    width:100%;
    max-width:1240px;
    margin:0 auto;
    padding:22px;
}

/* =========================
   HEADER
========================= */

.header{
    position:sticky;
    top:14px;
    z-index:20;

    height:68px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 20px;

    background:rgba(17,17,17,.92);
    border:1px solid var(--line);
    border-radius:22px;

    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);

    box-shadow:0 20px 60px rgba(0,0,0,.35);
}

.logo{
    font-size:19px;
    font-weight:950;
    letter-spacing:.08em;
}

.logo b{
    color:var(--yellow);
}

.nav{
    display:flex;
    align-items:center;
    gap:8px;
}

.nav a{
    padding:10px 14px;
    border:1px solid transparent;
    border-radius:12px;
    color:#aaa;
    font-size:13px;
    font-weight:800;
    transition:.2s;
}

.nav a:hover{
    color:#fff;
    border-color:#333;
    background:#181818;
}

.nav a.active{
    color:var(--yellow);
    border-color:#514600;
    background:#1b1909;
}

/* =========================
   PROFILE
========================= */

.profile{
    margin-top:70px;
}

.eyebrow{
    color:var(--yellow);
    font-size:11px;
    font-weight:950;
    letter-spacing:.22em;
    text-transform:uppercase;
}

.page-title{
    margin:10px 0 8px;
    font-size:54px;
    line-height:1;
    font-weight:950;
    letter-spacing:-.04em;
}

.page-subtitle{
    margin:0;
    color:var(--muted);
    font-size:15px;
}

/* =========================
   GRID
========================= */

.grid{
    display:grid;
    grid-template-columns:
        minmax(0,1.35fr)
        minmax(300px,.65fr);
    gap:18px;
    margin-top:28px;
}

.card{
    background:
        linear-gradient(
            180deg,
            rgba(23,23,23,.96),
            rgba(12,12,12,.96)
        );

    border:1px solid var(--line);
    border-radius:26px;
    padding:24px;

    box-shadow:
        0 25px 80px rgba(0,0,0,.28);
}

/* =========================
   ACCOUNT CARD
========================= */

.account-top{
    display:flex;
    align-items:center;
    gap:18px;
    margin-bottom:26px;
}

.avatar{
    width:76px;
    height:76px;

    flex:none;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:22px;

    background:
        linear-gradient(
            135deg,
            var(--yellow),
            var(--yellow2)
        );

    color:#080808;

    font-size:30px;
    font-weight:950;

    box-shadow:
        0 12px 35px rgba(255,210,26,.18);
}

.account-info{
    min-width:0;
}

.account-label{
    color:#777;
    font-size:11px;
    font-weight:900;
    letter-spacing:.12em;
    text-transform:uppercase;
}

.username{
    margin-top:4px;

    font-size:30px;
    font-weight:950;

    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

.status{
    margin-top:4px;
    color:var(--yellow);
    font-size:12px;
    font-weight:800;
}

/* =========================
   INFO ROWS
========================= */

.info-list{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.info-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;

    min-height:58px;
    padding:14px 16px;

    background:#0d0d0d;
    border:1px solid #242424;
    border-radius:16px;
}

.info-left{
    color:#777;
    font-size:11px;
    font-weight:900;
    letter-spacing:.08em;
    text-transform:uppercase;
}

.info-right{
    color:#fff;
    font-size:14px;
    font-weight:800;
    text-align:right;
    word-break:break-word;
}

.balance{
    color:var(--yellow);
    font-size:18px;
}

/* =========================
   SUBSCRIPTION
========================= */

.card-title{
    margin:0 0 18px;

    font-size:18px;
    font-weight:950;
}

.subscription{
    padding:20px;

    background:
        linear-gradient(
            135deg,
            #1c1908,
            #111
        );

    border:1px solid #4a4000;
    border-radius:20px;
}

.subscription-name{
    color:var(--yellow);
    font-size:12px;
    font-weight:950;
    letter-spacing:.12em;
    text-transform:uppercase;
}

.subscription-main{
    margin-top:8px;

    font-size:26px;
    font-weight:950;
}

.subscription-text{
    margin-top:7px;
    color:#888;
    font-size:13px;
    line-height:1.5;
}

.progress{
    height:8px;
    margin-top:18px;

    overflow:hidden;

    background:#292929;
    border-radius:999px;
}

.progress span{
    display:block;
    width:0%;
    height:100%;

    background:
        linear-gradient(
            90deg,
            var(--yellow2),
            var(--yellow)
        );

    border-radius:999px;

    transition:width .5s ease;
}

/* =========================
   ACTIONS
========================= */

.actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:18px;
}

.action{
    min-height:48px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:14px;

    border:1px solid #303030;
    background:#151515;

    color:#aaa;

    font-size:13px;
    font-weight:900;

    cursor:pointer;

    transition:.2s;
}

.action:hover{
    color:#fff;
    border-color:#444;
    background:#1b1b1b;
}

.action.primary{
    border-color:var(--yellow);
    background:var(--yellow);
    color:#070707;
}

.action.primary:hover{
    background:#ffe05a;
}

/* =========================
   LOADING
========================= */

.loading{
    min-height:360px;

    display:flex;
    align-items:center;
    justify-content:center;

    color:#777;
    font-size:14px;
}

.loader{
    width:28px;
    height:28px;

    border:3px solid #303030;
    border-top-color:var(--yellow);

    border-radius:50%;

    animation:spin .8s linear infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

/* =========================
   ERROR
========================= */

.error{
    display:none;

    margin-top:28px;
    padding:20px;

    border:1px solid #4a2020;
    border-radius:18px;

    background:#160b0b;

    color:#ff7777;

    text-align:center;
    font-size:14px;
    line-height:1.5;
}

/* =========================
   FOOTER
========================= */

.footer{
    margin-top:35px;
    padding:25px 0 10px;

    border-top:1px solid #1e1e1e;

    color:#555;
    text-align:center;
    font-size:11px;
}

/* =========================
   MOBILE
========================= */

@media(max-width:760px){

    .wrap{
        padding:14px;
    }

    .header{
        top:8px;
        height:60px;
        padding:0 14px;
    }

    .logo{
        font-size:16px;
    }

    .nav a{
        padding:8px 9px;
        font-size:11px;
    }

    .profile{
        margin-top:42px;
    }

    .page-title{
        font-size:42px;
    }

    .page-subtitle{
        font-size:13px;
    }

    .grid{
        grid-template-columns:1fr;
    }

    .card{
        padding:19px;
        border-radius:22px;
    }

    .account-top{
        gap:14px;
    }

    .avatar{
        width:62px;
        height:62px;
        border-radius:18px;
        font-size:25px;
    }

    .username{
        font-size:24px;
    }

    .info-row{
        padding:13px;
    }

    .actions{
        grid-template-columns:1fr;
    }
}

@media(max-width:430px){

    .nav a{
        display:none;
    }

    .nav a.active{
        display:block;
    }

    .page-title{
        font-size:36px;
    }
}
</style>
</head>

<body>

<div class="wrap">

    <!-- HEADER -->

    <header class="header">

        <a href="shop.html" class="logo">
            MEANT <b>SHOP</b>
        </a>

        <nav class="nav">

            <a href="shop.html">
                Магазин
            </a>

            <a href="visual.html">
                Visual
            </a>

            <a href="profile.html" class="active">
                Профиль
            </a>

        </nav>

    </header>


    <!-- PROFILE -->

    <main class="profile">

        <div class="eyebrow">
            MEANT ACCOUNT
        </div>

        <h1 class="page-title">
            ПРОФИЛЬ
        </h1>

        <p class="page-subtitle">
            Информация о твоём аккаунте MEANT SHOP.
        </p>


        <!-- LOADING -->

        <div id="loading" class="card loading">

            <div class="loader"></div>

        </div>


        <!-- ERROR -->

        <div id="error" class="error"></div>


        <!-- CONTENT -->

        <div id="content" class="grid" style="display:none">


            <!-- ACCOUNT -->

            <section class="card">

                <div class="account-top">

                    <div id="avatar" class="avatar">
                        ?
                    </div>

                    <div class="account-info">

                        <div class="account-label">
                            Никнейм
                        </div>

                        <div id="username" class="username">
                            —
                        </div>

                        <div id="status" class="status">
                            Пользователь
                        </div>

                    </div>

                </div>


                <div class="info-list">


                    <div class="info-row">

                        <div class="info-left">
                            ID аккаунта
                        </div>

                        <div id="accountId" class="info-right">
                            —
                        </div>

                    </div>


                    <div class="info-row">

                        <div class="info-left">
                            Баланс
                        </div>

                        <div id="balance" class="info-right balance">
                            0 ₽
                        </div>

                    </div>


                    <div class="info-row">

                        <div class="info-left">
                            Аккаунт создан
                        </div>

                        <div id="createdAt" class="info-right">
                            —
                        </div>

                    </div>


                    <div class="info-row">

                        <div class="info-left">
                            Статус
                        </div>

                        <div id="accountStatus" class="info-right">
                            Активен
                        </div>

                    </div>

                </div>

            </section>


            <!-- SUBSCRIPTION -->

            <section class="card">

                <h2 class="card-title">
                    Подписка
                </h2>


                <div class="subscription">

                    <div class="subscription-name">
                        MEANT ACCESS
                    </div>

                    <div id="subscriptionName"
                         class="subscription-main">
                        Нет активной подписки
                    </div>

                    <div id="subscriptionText"
                         class="subscription-text">
                        После покупки подписка появится здесь.
                    </div>

                    <div class="progress">
                        <span id="progressBar"></span>
                    </div>

                </div>


                <div class="actions">

                    <a href="shop.html"
                       class="action primary">
                        Купить подписку
                    </a>

                    <button
                        id="logoutButton"
                        class="action"
                        type="button">
                        Выйти
                    </button>

                </div>

            </section>

        </div>


        <footer class="footer">
            MEANT SHOP
        </footer>

    </main>

</div>


<script>
/* =========================================================
   MEANT SHOP — PROFILE
   Ник берётся из /api/auth/me
========================================================= */


/* =========================================================
   ELEMENTS
========================================================= */

const loading =
    document.getElementById("loading");

const content =
    document.getElementById("content");

const errorBox =
    document.getElementById("error");

const usernameElement =
    document.getElementById("username");

const avatarElement =
    document.getElementById("avatar");

const accountIdElement =
    document.getElementById("accountId");

const balanceElement =
    document.getElementById("balance");

const createdAtElement =
    document.getElementById("createdAt");

const statusElement =
    document.getElementById("status");

const accountStatusElement =
    document.getElementById("accountStatus");

const subscriptionNameElement =
    document.getElementById("subscriptionName");

const subscriptionTextElement =
    document.getElementById("subscriptionText");

const progressBar =
    document.getElementById("progressBar");

const logoutButton =
    document.getElementById("logoutButton");


/* =========================================================
   ERROR
========================================================= */

function showError(message){

    loading.style.display = "none";

    content.style.display = "none";

    errorBox.style.display = "block";

    errorBox.textContent = message;

}


/* =========================================================
   DATE
========================================================= */

function formatDate(value){

    if(!value){
        return "—";
    }

    const date =
        new Date(
            String(value).replace(" ","T") + "Z"
        );

    if(
        Number.isNaN(
            date.getTime()
        )
    ){

        return String(value);

    }

    return date.toLocaleDateString(
        "ru-RU",
        {
            day:"2-digit",
            month:"2-digit",
            year:"numeric"
        }
    );

}


/* =========================================================
   BALANCE
========================================================= */

function formatBalance(value){

    const number =
        Number(value || 0);

    return number.toLocaleString(
        "ru-RU"
    ) + " ₽";

}


/* =========================================================
   LOAD PROFILE
========================================================= */

async function loadProfile(){

    try{

        const response =
            await fetch(
                "/api/auth/me",
                {
                    method:"GET",
                    credentials:"include",
                    cache:"no-store"
                }
            );


        let data = null;

        try{

            data =
                await response.json();

        }catch{

            data = null;

        }


        /* -----------------------------------------
           NOT AUTHORIZED
        ----------------------------------------- */

        if(
            !response.ok ||
            !data ||
            data.authenticated !== true
        ){

            window.location.href =
                "auth.html?mode=login";

            return;

        }


        const account =
            data.account || {};


        /* -----------------------------------------
           USERNAME
        ----------------------------------------- */

        const username =
            String(
                account.username || ""
            ).trim();


        if(!username){

            showError(
                "Не удалось получить никнейм аккаунта."
            );

            return;

        }


        /*
         * ВАЖНО:
         * Здесь больше НЕТ "ТЕСТ ЮЗЕР".
         *
         * Ник всегда берётся из D1
         * через /api/auth/me.
         */

        usernameElement.textContent =
            username;


        /* -----------------------------------------
           AVATAR
        ----------------------------------------- */

        avatarElement.textContent =
            username
                .charAt(0)
                .toUpperCase();


        /* -----------------------------------------
           ACCOUNT ID
        ----------------------------------------- */

        accountIdElement.textContent =
            account.id || "—";


        /* -----------------------------------------
           BALANCE
        ----------------------------------------- */

        balanceElement.textContent =
            formatBalance(
                account.balance
            );


        /* -----------------------------------------
           CREATED
        ----------------------------------------- */

        createdAtElement.textContent =
            formatDate(
                account.created_at
            );


        /* -----------------------------------------
           STATUS
        ----------------------------------------- */

        statusElement.textContent =
            "Пользователь";

        accountStatusElement.textContent =
            "Активен";


        /* -----------------------------------------
           SUBSCRIPTION
        -----------------------------------------

           Пока API /api/auth/me возвращает
           только аккаунт.

           Поэтому подписка показывает
           состояние "нет активной подписки".

           Позже сюда можно подключить
           entitlements.
        ----------------------------------------- */

        subscriptionNameElement.textContent =
            "Нет активной подписки";

        subscriptionTextElement.textContent =
            "После покупки подписка появится здесь.";

        progressBar.style.width =
            "0%";


        /* -----------------------------------------
           SHOW
        ----------------------------------------- */

        loading.style.display =
            "none";

        errorBox.style.display =
            "none";

        content.style.display =
            "grid";


    }catch(error){

        console.error(
            "PROFILE ERROR:",
            error
        );

        showError(
            "Не удалось загрузить профиль. Проверь соединение с сервером."
        );

    }

}


/* =========================================================
   LOGOUT
========================================================= */

logoutButton.addEventListener(
    "click",
    async function(){

        logoutButton.disabled =
            true;

        logoutButton.textContent =
            "Выход...";

        try{

            await fetch(
                "/api/auth/logout",
                {
                    method:"POST",
                    credentials:"include"
                }
            );

        }catch(error){

            console.error(
                "LOGOUT ERROR:",
                error
            );

        }

        /*
         * Старый ID тоже удаляем,
         * чтобы не оставался старый тестовый аккаунт.
         */

        try{

            localStorage.removeItem(
                "meant_account_id"
            );

        }catch(error){

            console.error(error);

        }

        window.location.href =
            "auth.html?mode=login";

    }
);


/* =========================================================
   START
========================================================= */

loadProfile();

</script>

</body>
</html>

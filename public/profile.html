<div class="subscription">
  <div class="sub-top">
    <h2 class="section-title" style="margin:0">Подписка</h2>
    <span class="active" id="subscriptionStatus">● Нет подписки</span>
  </div>

  <div class="row" style="border:1px solid #252525;border-radius:16px;margin-bottom:12px">
    <span>Тариф</span>
    <b class="forever" id="subscriptionPlan">Нет активной подписки</b>
  </div>

  <div class="progress" id="subscriptionProgressWrap" style="display:none">
    <span id="subscriptionProgress"></span>
  </div>

  <div class="sub-grid" id="subscriptionDetails" style="display:none">
    <div class="sub-box">
      <small>Оформлена</small>
      <b id="subscriptionCreated">—</b>
    </div>

    <div class="sub-box">
      <small>Истекает</small>
      <b id="subscriptionExpires">—</b>
    </div>

    <div class="sub-box">
      <small>Осталось</small>
      <b id="subscriptionRemaining">—</b>
    </div>
  </div>

  <div class="note" id="subscriptionNote">
    У аккаунта пока нет активной подписки.
  </div>
</div>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MEANT SHOP — Профиль</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family:
                Inter,
                Arial,
                sans-serif;

            background:
                radial-gradient(
                    circle at 50% -20%,
                    #27324d 0%,
                    #111827 42%,
                    #080b12 100%
                );

            color: white;
        }

        button,
        a {
            font-family: inherit;
        }

        .page {
            min-height: 100vh;
            padding: 30px;
        }

        /* =========================
           HEADER
        ========================= */

        .header {
            width: 100%;
            max-width: 1450px;
            margin: 0 auto 35px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 18px 24px;

            background:
                rgba(20, 27, 43, 0.92);

            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 22px;

            box-shadow:
                0 20px 60px rgba(0,0,0,0.25);
        }

        .logo {
            font-size: 25px;
            font-weight: 900;
            letter-spacing: -0.5px;
        }

        .logo span {
            color: #ffc400;
        }

        .nav {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav a {
            text-decoration: none;
            color: #fff;

            padding: 14px 28px;

            border-radius: 15px;

            font-weight: 700;
            font-size: 15px;

            transition: 0.2s;
        }

        .nav a:hover {
            background: rgba(255,255,255,0.06);
        }

        .nav a.active {
            color: #ffc400;

            border: 1px solid #ffc400;

            background:
                rgba(255,196,0,0.04);

            box-shadow:
                0 0 20px rgba(255,196,0,0.08);
        }

        .logout {
            border: none;
            background: #f3f3f3;
            color: #111;

            padding: 10px 18px;

            border-radius: 8px;

            font-weight: 700;
            cursor: pointer;
        }

        /* =========================
           MAIN
        ========================= */

        .container {
            width: 100%;
            max-width: 1450px;
            margin: 0 auto;
        }

        .profile-grid {
            display: grid;
            grid-template-columns:
                420px
                1fr;

            gap: 28px;
        }

        .card {
            background:
                linear-gradient(
                    145deg,
                    rgba(27,36,57,0.96),
                    rgba(13,18,29,0.96)
                );

            border: 1px solid rgba(255,255,255,0.08);

            border-radius: 25px;

            box-shadow:
                0 25px 70px rgba(0,0,0,0.3);
        }

        /* =========================
           USER CARD
        ========================= */

        .user-card {
            padding: 32px;
        }

        .user-top {
            display: flex;
            align-items: center;
            gap: 20px;

            padding-bottom: 28px;

            border-bottom:
                1px solid rgba(255,255,255,0.1);
        }

        .avatar {
            width: 92px;
            height: 92px;

            border-radius: 24px;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                linear-gradient(
                    145deg,
                    #ffd000,
                    #ffad00
                );

            color: #151515;

            font-size: 42px;
            font-weight: 900;

            flex-shrink: 0;

            box-shadow:
                0 12px 30px rgba(255,190,0,0.18);
        }

        .user-name {
            font-size: 28px;
            font-weight: 900;

            word-break: break-word;
        }

        .user-status {
            margin-top: 7px;

            color: #ffc400;

            font-size: 14px;
            font-weight: 900;

            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .balance-title {
            margin-top: 32px;

            color: #9ba4b7;

            font-size: 13px;
            font-weight: 800;

            text-transform: uppercase;
        }

        .balance {
            margin-top: 8px;

            font-size: 32px;
            font-weight: 900;
        }

        .balance-button {
            width: 100%;

            margin-top: 28px;

            padding: 17px;

            border: none;
            border-radius: 15px;

            background:
                linear-gradient(
                    135deg,
                    #ffd000,
                    #ffb700
                );

            color: #151515;

            font-size: 16px;
            font-weight: 900;

            cursor: pointer;

            transition: 0.2s;
        }

        .balance-button:hover {
            transform: translateY(-1px);

            box-shadow:
                0 10px 30px
                rgba(255,193,0,0.2);
        }

        /* =========================
           ACCOUNT
        ========================= */

        .account-card {
            padding: 32px;
        }

        .section-title {
            font-size: 24px;
            font-weight: 900;

            margin-bottom: 22px;
        }

        .account-row {
            min-height: 70px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 18px 20px;

            border:
                1px solid
                rgba(255,255,255,0.07);

            border-radius: 14px;

            background:
                rgba(255,255,255,0.025);
        }

        .account-row + .account-row {
            margin-top: 10px;
        }

        .row-label {
            color: #a9b1c0;
            font-size: 14px;
        }

        .row-value {
            max-width: 60%;

            text-align: right;

            font-weight: 800;

            word-break: break-all;
        }

        /* =========================
           SUBSCRIPTION
        ========================= */

        .subscription {
            margin-top: 32px;
        }

        .subscription-header {
            display: flex;
            align-items: center;
            justify-content: space-between;

            margin-bottom: 15px;
        }

        .subscription-status {
            font-size: 14px;
            font-weight: 900;
        }

        .subscription-status.active {
            color: #63f58b;
        }

        .subscription-status.inactive {
            color: #9ba4b7;
        }

        .subscription-box {
            padding: 22px;

            border:
                1px solid
                rgba(255,255,255,0.08);

            border-radius: 17px;

            background:
                rgba(255,255,255,0.025);
        }

        .subscription-name {
            display: flex;
            align-items: center;
            justify-content: space-between;

            font-size: 15px;
            color: #aab2c1;
        }

        .subscription-name strong {
            color: white;
            font-size: 17px;
        }

        .progress {
            width: 100%;
            height: 9px;

            margin-top: 18px;

            background:
                #283247;

            border-radius: 20px;

            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%;

            background:
                linear-gradient(
                    90deg,
                    #ffe000,
                    #ffb800
                );

            border-radius: 20px;

            transition: width 0.4s;
        }

        .subscription-info {
            display: grid;
            grid-template-columns:
                repeat(3, 1fr);

            gap: 10px;

            margin-top: 16px;
        }

        .subscription-item {
            padding: 14px;

            border-radius: 13px;

            background:
                rgba(255,255,255,0.035);
        }

        .subscription-item span {
            display: block;

            color: #858fa2;

            font-size: 12px;
        }

        .subscription-item strong {
            display: block;

            margin-top: 7px;

            font-size: 14px;
        }

        .no-subscription {
            color: #9ba4b7;

            font-size: 15px;

            line-height: 1.5;
        }

        /* =========================
           LOADING / ERROR
        ========================= */

        .loading {
            position: fixed;
            inset: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                #080b12;

            z-index: 100;
        }

        .loading-box {
            text-align: center;
        }

        .loading-logo {
            font-size: 34px;
            font-weight: 900;
        }

        .loading-logo span {
            color: #ffc400;
        }

        .spinner {
            width: 38px;
            height: 38px;

            margin: 20px auto 0;

            border:
                4px solid
                rgba(255,255,255,0.12);

            border-top-color:
                #ffc400;

            border-radius: 50%;

            animation:
                spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .error-screen {
            display: none;

            min-height: 100vh;

            align-items: center;
            justify-content: center;

            padding: 30px;
        }

        .error-box {
            max-width: 500px;

            padding: 35px;

            text-align: center;

            background: #141b2a;

            border:
                1px solid
                rgba(255,255,255,0.08);

            border-radius: 22px;
        }

        .error-box h2 {
            color: #ff5c5c;
            margin-bottom: 15px;
        }

        .error-box p {
            color: #aeb6c5;
            line-height: 1.6;
        }

        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 1000px) {

            .profile-grid {
                grid-template-columns: 1fr;
            }

            .nav a {
                padding:
                    12px 16px;
            }

        }

        @media (max-width: 700px) {

            .page {
                padding: 15px;
            }

            .header {
                padding: 14px;
                border-radius: 17px;

                flex-wrap: wrap;
                gap: 15px;
            }

            .logo {
                font-size: 20px;
            }

            .nav {
                width: 100%;

                overflow-x: auto;

                justify-content: flex-start;
            }

            .nav a {
                white-space: nowrap;
                padding: 11px 15px;
                font-size: 13px;
            }

            .logout {
                display: none;
            }

            .user-card,
            .account-card {
                padding: 22px;
            }

            .user-top {
                gap: 14px;
            }

            .avatar {
                width: 72px;
                height: 72px;

                border-radius: 19px;

                font-size: 32px;
            }

            .user-name {
                font-size: 22px;
            }

            .subscription-info {
                grid-template-columns: 1fr;
            }

            .account-row {
                align-items: flex-start;
                flex-direction: column;
                gap: 8px;
            }

            .row-value {
                max-width: 100%;
                text-align: left;
            }
        }
    </style>
</head>

<body>

    <!-- =========================
         LOADING
    ========================= -->

    <div
        class="loading"
        id="loading"
    >
        <div class="loading-box">

            <div class="loading-logo">
                MEANT <span>SHOP</span>
            </div>

            <div class="spinner"></div>

        </div>
    </div>


    <!-- =========================
         ERROR
    ========================= -->

    <div
        class="error-screen"
        id="errorScreen"
    >
        <div class="error-box">

            <h2>Ошибка авторизации</h2>

            <p id="errorText">
                Не удалось загрузить аккаунт.
            </p>

        </div>
    </div>


    <!-- =========================
         PAGE
    ========================= -->

    <div
        class="page"
        id="page"
        style="display:none;"
    >

        <!-- HEADER -->

        <header class="header">

            <div class="logo">
                MEANT <span>SHOP</span>
            </div>

            <nav class="nav">

                <a href="/index.html">
                    Visual
                </a>

                <a
                    href="/profile.html"
                    class="active"
                >
                    Профиль
                </a>

                <a href="/shop.html">
                    Магазин
                </a>

                <a href="/finance.html">
                    Финансы
                </a>

                <button
                    class="logout"
                    id="logoutButton"
                >
                    Выйти
                </button>

            </nav>

        </header>


        <!-- MAIN -->

        <main class="container">

            <div class="profile-grid">


                <!-- =====================
                     USER
                ====================== -->

                <section class="card user-card">

                    <div class="user-top">

                        <div
                            class="avatar"
                            id="avatar"
                        >
                            ?
                        </div>

                        <div>

                            <div
                                class="user-name"
                                id="username"
                            >
                                —
                            </div>

                            <div
                                class="user-status"
                                id="userStatus"
                            >
                                User
                            </div>

                        </div>

                    </div>


                    <div class="balance-title">
                        Текущий баланс
                    </div>

                    <div
                        class="balance"
                        id="balance"
                    >
                        0
                    </div>


                    <button
                        class="balance-button"
                        onclick="location.href='/finance.html'"
                    >
                        Пополнить баланс
                    </button>

                </section>


                <!-- =====================
                     ACCOUNT
                ====================== -->

                <section class="card account-card">

                    <h2 class="section-title">
                        Данные аккаунта
                    </h2>


                    <div class="account-row">

                        <span class="row-label">
                            ID аккаунта
                        </span>

                        <strong
                            class="row-value"
                            id="accountId"
                        >
                            —
                        </strong>

                    </div>


                    <div class="account-row">

                        <span class="row-label">
                            Никнейм
                        </span>

                        <strong
                            class="row-value"
                            id="accountUsername"
                        >
                            —
                        </strong>

                    </div>


                    <div class="account-row">

                        <span class="row-label">
                            Статус / титул
                        </span>

                        <strong
                            class="row-value"
                            id="accountStatus"
                        >
                            User
                        </strong>

                    </div>


                    <!-- =====================
                         SUBSCRIPTION
                    ====================== -->

                    <div class="subscription">

                        <div class="subscription-header">

                            <h2 class="section-title">
                                Подписка
                            </h2>

                            <div
                                class="subscription-status inactive"
                                id="subscriptionStatus"
                            >
                                • НЕТ АКТИВНОЙ
                            </div>

                        </div>


                        <div
                            class="subscription-box"
                            id="subscriptionBox"
                        >

                            <div class="no-subscription">
                                У аккаунта нет активной
                                Premium-подписки.
                            </div>

                        </div>

                    </div>

                </section>

            </div>

        </main>

    </div>


<script>

    /* =====================================================
       API
    ===================================================== */

    const API_BASE = "";


    /* =====================================================
       HELPERS
    ===================================================== */

    function getInitial(username) {

        if (
            !username ||
            typeof username !== "string"
        ) {
            return "?";
        }

        const value =
            username
                .trim()
                .charAt(0)
                .toUpperCase();

        return value || "?";
    }


    function formatBalance(value) {

        const number =
            Number(value || 0);

        return number.toLocaleString(
            "ru-RU"
        );
    }


    function escapeHtml(value) {

        return String(value ?? "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }


    /* =====================================================
       SUBSCRIPTION
       
       ВАЖНО:
       Если сервер НЕ передал subscription,
       мы НИЧЕГО не придумываем.
    ===================================================== */

    function renderSubscription(
        account
    ) {

        const status =
            document.getElementById(
                "subscriptionStatus"
            );

        const box =
            document.getElementById(
                "subscriptionBox"
            );

        /*
          Проверяем только реальные данные,
          которые пришли с сервера.
        */

        const subscription =
            account?.subscription;


        /*
          Нет subscription вообще.
          Значит Premium отсутствует.
        */

        if (
            !subscription ||
            subscription.active !== true
        ) {

            status.textContent =
                "• НЕТ АКТИВНОЙ";

            status.className =
                "subscription-status inactive";

            box.innerHTML = `
                <div class="no-subscription">
                    У аккаунта нет активной
                    Premium-подписки.
                </div>
            `;

            return;
        }


        /*
          Реальная активная подписка.
        */

        status.textContent =
            "• АКТИВНА";

        status.className =
            "subscription-status active";


        const plan =
            subscription.plan ||
            "Premium";


        const startedAt =
            subscription.started_at ||
            subscription.start_date ||
            null;


        const expiresAt =
            subscription.expires_at ||
            subscription.end_date ||
            null;


        let progress = 0;


        if (
            startedAt &&
            expiresAt
        ) {

            const start =
                new Date(
                    startedAt
                ).getTime();

            const end =
                new Date(
                    expiresAt
                ).getTime();

            const now =
                Date.now();


            if (
                end > start
            ) {

                progress =
                    (
                        (now - start) /
                        (end - start)
                    ) * 100;

                progress =
                    Math.max(
                        0,
                        Math.min(
                            100,
                            progress
                        )
                    );

            }

        }


        box.innerHTML = `

            <div class="subscription-name">

                <span>
                    Тариф
                </span>

                <strong>
                    ${escapeHtml(plan)}
                </strong>

            </div>


            <div class="progress">

                <div
                    class="progress-bar"
                    style="width:${progress}%"
                ></div>

            </div>


            <div class="subscription-info">

                <div class="subscription-item">

                    <span>
                        Оформлена
                    </span>

                    <strong>
                        ${
                            startedAt
                                ? escapeHtml(
                                    new Date(
                                        startedAt
                                    ).toLocaleDateString(
                                        "ru-RU"
                                    )
                                )
                                : "—"
                        }
                    </strong>

                </div>


                <div class="subscription-item">

                    <span>
                        До
                    </span>

                    <strong>
                        ${
                            expiresAt
                                ? escapeHtml(
                                    new Date(
                                        expiresAt
                                    ).toLocaleDateString(
                                        "ru-RU"
                                    )
                                )
                                : "—"
                        }
                    </strong>

                </div>


                <div class="subscription-item">

                    <span>
                        Статус
                    </span>

                    <strong>
                        Активна
                    </strong>

                </div>

            </div>
        `;
    }


    /* =====================================================
       STATUS
    ===================================================== */

    function renderStatus(
        account
    ) {

        /*
          НИКАКОГО PREMIUM USER
          ПО УМОЛЧАНИЮ НЕТ.

          Premium появляется только если
          backend реально передал premium === true.
        */

        const isPremium =
            account?.premium === true;


        const status =
            isPremium
                ? "Premium User"
                : "User";


        document.getElementById(
            "userStatus"
        ).textContent =
            status;


        document.getElementById(
            "accountStatus"
        ).textContent =
            status;
    }


    /* =====================================================
       LOAD ACCOUNT
    ===================================================== */

    async function loadProfile() {

        try {

            const response =
                await fetch(
                    API_BASE +
                    "/api/auth/me",
                    {
                        method: "GET",

                        credentials: "include",

                        headers: {
                            "Accept":
                                "application/json"
                        }
                    }
                );


            const data =
                await response.json();


            /*
              Пользователь не авторизован.
            */

            if (
                !response.ok ||
                data?.authenticated !== true
            ) {

                throw new Error(
                    data?.error ||
                    "Вы не авторизованы"
                );

            }


            const account =
                data.account;


            if (!account) {

                throw new Error(
                    "Сервер не вернул данные аккаунта"
                );

            }


            /*
              USERNAME
            */

            const username =
                String(
                    account.username ||
                    ""
                ).trim();


            /*
              ID
            */

            const accountId =
                String(
                    account.id ||
                    ""
                );


            /*
              Ник
            */

            document.getElementById(
                "username"
            ).textContent =
                username || "User";


            document.getElementById(
                "accountUsername"
            ).textContent =
                username || "—";


            /*
              ID
            */

            document.getElementById(
                "accountId"
            ).textContent =
                accountId || "—";


            /*
              АВАТАР
            */

            document.getElementById(
                "avatar"
            ).textContent =
                getInitial(
                    username
                );


            /*
              BALANCE
            */

            document.getElementById(
                "balance"
            ).textContent =
                formatBalance(
                    account.balance
                );


            /*
              STATUS
            */

            renderStatus(
                account
            );


            /*
              SUBSCRIPTION

              Здесь принципиально важно:
              если backend не передал subscription,
              никакие 3 дня/30 дней/90 дней
              НЕ создаются.
            */

            renderSubscription(
                account
            );


            /*
              Показываем страницу.
            */

            document.getElementById(
                "loading"
            ).style.display =
                "none";


            document.getElementById(
                "page"
            ).style.display =
                "block";


        } catch (error) {

            console.error(
                "Profile error:",
                error
            );


            document.getElementById(
                "loading"
            ).style.display =
                "none";


            document.getElementById(
                "errorScreen"
            ).style.display =
                "flex";


            document.getElementById(
                "errorText"
            ).textContent =
                error?.message ||
                "Не удалось загрузить аккаунт.";
        }
    }


    /* =====================================================
       LOGOUT
    ===================================================== */

    document
        .getElementById(
            "logoutButton"
        )
        .addEventListener(
            "click",
            async () => {

                try {

                    await fetch(
                        API_BASE +
                        "/api/auth/logout",
                        {
                            method: "POST",
                            credentials: "include"
                        }
                    );

                } catch (error) {

                    console.error(
                        error
                    );

                }

                window.location.href =
                    "/login.html";
            }
        );


    /* =====================================================
       START
    ===================================================== */

    loadProfile();

</script>

</body>
</html>

<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MEANT SHOP — Visual</title>
<style>
:root{--bg:#070707;--card:#111;--line:#292929;--yellow:#ffd21a;--text:#f7f7f7;--muted:#909090}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -10%,#2b2400 0,#0b0b0b 34%,#050505 75%);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.wrap{max-width:1120px;margin:auto;padding:22px}
header{height:68px;display:flex;align-items:center;justify-content:center;background:rgba(15,15,15,.88);backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:22px;box-shadow:0 18px 55px #0008}
.logo{font-size:19px;font-weight:950;letter-spacing:.08em}.logo b{color:var(--yellow)}
.nav-tabs{display:flex;gap:8px;align-items:center;margin-left:auto}.nav-tabs a{display:inline-flex;align-items:center;justify-content:center;min-width:120px;padding:10px 14px;border:1px solid #303030;background:#181818;color:#eee;border-radius:13px;text-decoration:none;font-size:12px;font-weight:800;white-space:nowrap;transition:.18s}.nav-tabs a:hover,.nav-tabs a.active{border-color:var(--yellow);color:var(--yellow);background:#1d1a08}
.hero{text-align:center;padding:82px 10px 55px}
.eyebrow{font-size:11px;color:var(--yellow);font-weight:900;letter-spacing:.22em}
h1{font-size:clamp(42px,8vw,78px);line-height:.9;margin:14px 0 18px;letter-spacing:-.05em}
.hero p{color:var(--muted);max-width:560px;margin:auto;line-height:1.6;font-size:15px}
.auth{display:flex;justify-content:center;gap:12px;margin-top:30px}
.btn{min-width:170px;padding:15px 25px;border-radius:15px;font:inherit;font-weight:950;cursor:pointer;text-decoration:none;text-align:center}
.primary{background:var(--yellow);color:#050505;border:1px solid var(--yellow)}
.secondary{background:#151515;color:#fff;border:1px solid #333}
.btn:hover{transform:translateY(-2px)}
.preview-title{text-align:center;margin:20px 0 18px;font-size:18px;font-weight:900}







footer{text-align:center;color:#555;font-size:11px;padding:35px 0 15px}
@media(max-width:760px){header{height:auto;min-height:68px;padding:10px;gap:10px;flex-wrap:wrap;justify-content:center}.nav-tabs{width:100%;justify-content:center;margin-left:0}.nav-tabs a{min-width:0;flex:1;padding:9px 6px;font-size:10px}.auth{flex-direction:column;align-items:center}.btn{width:min(100%,320px)}}
.compare{position:relative;width:100%;aspect-ratio:16/9;min-height:320px;border:1px solid #303030;border-radius:25px;overflow:hidden;background:#111;box-shadow:0 25px 80px #0008;user-select:none;touch-action:none}
.side{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden}.clip{position:absolute;inset:0;width:50%;overflow:hidden;z-index:2}.clip .side{width:100vw;max-width:none}
.with{background:linear-gradient(135deg,#242000,#151515 48%,#0c0c0c)}
.without{background:linear-gradient(135deg,#101010,#191919 48%,#080808)}
.fake-scene{width:72%;height:68%;border:1px solid #383838;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:clamp(14px,2vw,25px);font-weight:950;letter-spacing:.1em;color:#666;background:repeating-linear-gradient(0deg,#111 0,#111 7px,#141414 8px)}
.with .fake-scene{box-shadow:0 0 90px #ffd21a22;border-color:#554d1d}
.with .fake-scene span{color:var(--yellow)}
.divider{position:absolute;top:0;bottom:0;left:50%;width:3px;background:#fff;transform:translateX(-50%);z-index:5;box-shadow:0 0 15px #000}
.handle{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:52px;height:52px;border-radius:50%;background:var(--yellow);border:4px solid #0b0b0b;box-shadow:0 5px 25px #000;display:grid;place-items:center;color:#050505;font-weight:950;font-size:20px;cursor:ew-resize}
.handle:before{content:"‹  ›";letter-spacing:-3px}
.label{position:absolute;top:18px;padding:10px 15px;border:1px solid #3b3b3b;background:#0b0b0dcc;backdrop-filter:blur(8px);border-radius:12px;font-size:11px;font-weight:950;letter-spacing:.1em;z-index:4}
.label.left{left:18px}
.label.right{right:18px}
.hint{text-align:center;color:#666;font-size:11px;margin:15px 0 0}
</style>
</head>
<body>
<div class="wrap">
<header><div class="logo">MEANT <b>SHOP</b></div><nav class="nav-tabs"><a class="active" href="visual.html">Visual</a><a href="profile.html">Профиль</a><a href="shop.html">Магазин</a></nav></header>

<section class="hero">
  <div class="eyebrow">MEANT VISUAL</div>
  <h1>VISUAL</h1>
  <p>Покупайте игровые предметы и управляйте своим аккаунтом в одном месте.</p>
  <div class="auth">
    <a class="btn primary" href="auth.html?mode=login">Войти</a>
    <a class="btn secondary" href="auth.html?mode=register">Авторизоваться</a>
  </div>
</section>

<section>
  <div class="preview-title">ПРЕДМЕТ В ИГРЕ</div>
  <div class="compare" id="compare">
  <div class="side without" id="without"><div class="fake-scene"><span>БЕЗ ПРЕДМЕТА</span></div></div>
  <div class="clip" id="clip"><div class="side with"><div class="fake-scene"><span>С ПРЕДМЕТОМ</span></div></div></div>
  <div class="label left">С ПРЕДМЕТОМ</div>
  <div class="label right">БЕЗ ПРЕДМЕТА</div>
  <div class="divider" id="divider"></div>
  <div class="handle" id="handle" aria-label="Перетащить ползунок" role="slider" tabindex="0" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50"></div>
</div>
<div class="hint">← Перетяните жёлтый ползунок →</div>
</section>

<footer>© 2026 MEANT SHOP</footer>
</div>
<script>
(function(){
  const box=document.getElementById('compare');
  const clip=document.getElementById('clip');
  const divider=document.getElementById('divider');
  const handle=document.getElementById('handle');
  let value=50, dragging=false;

  function setValue(v){
    value=Math.max(0,Math.min(100,v));
    clip.style.width=value+'%';
    divider.style.left=value+'%';
    handle.style.left=value+'%';
    handle.setAttribute('aria-valuenow',String(Math.round(value)));
  }
  function fromEvent(e){
    const r=box.getBoundingClientRect();
    const x=(e.touches?e.touches[0].clientX:e.clientX)-r.left;
    setValue((x/r.width)*100);
  }
  function start(e){ dragging=true; fromEvent(e); e.preventDefault(); }
  function move(e){ if(!dragging)return; fromEvent(e); e.preventDefault(); }
  function stop(){ dragging=false; }

  box.addEventListener('pointerdown',start);
  window.addEventListener('pointermove',move,{passive:false});
  window.addEventListener('pointerup',stop);
  box.addEventListener('touchstart',start,{passive:false});
  window.addEventListener('touchmove',move,{passive:false});
  window.addEventListener('touchend',stop);
  handle.addEventListener('keydown',function(e){
    if(e.key==='ArrowLeft'){setValue(value-2);e.preventDefault()}
    if(e.key==='ArrowRight'){setValue(value+2);e.preventDefault()}
    if(e.key==='Home'){setValue(0);e.preventDefault()}
    if(e.key==='End'){setValue(100);e.preventDefault()}
  });
  setValue(50);
})();
</script>
</body>
</html>

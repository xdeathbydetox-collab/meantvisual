<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MEANT SHOP — Вход</title>
<style>
:root{--bg:#060606;--card:#101010;--line:#2a2a2a;--yellow:#ffd21a;--text:#f7f7f7;--muted:#8b8b8b}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -10%,#2b2400 0,#0b0b0b 34%,#050505 75%);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:520px;margin:auto;padding:22px}.top{height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;background:#111;border:1px solid var(--line);border-radius:22px}.logo{font-size:19px;font-weight:950;letter-spacing:.08em}.logo b{color:var(--yellow)}.back{color:#aaa;text-decoration:none;font-size:13px}.card{margin-top:70px;background:linear-gradient(180deg,#151515,#0c0c0c);border:1px solid var(--line);border-radius:28px;padding:28px;box-shadow:0 25px 80px #0009}.eyebrow{color:var(--yellow);font-size:11px;font-weight:900;letter-spacing:.2em;text-align:center}.title{text-align:center;font-size:42px;line-height:.95;margin:12px 0}.subtitle{text-align:center;color:var(--muted);font-size:14px;line-height:1.5;margin-bottom:28px}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:20px}.tabs button{padding:12px;border-radius:13px;border:1px solid #303030;background:#151515;color:#aaa;font:inherit;font-weight:800;cursor:pointer}.tabs button.active{background:#1d1a08;border-color:var(--yellow);color:var(--yellow)}.field{margin-bottom:13px}.field label{display:block;color:#777;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin-bottom:7px}.field input{width:100%;padding:14px;border-radius:13px;background:#0c0c0c;border:1px solid #303030;color:#fff;font:inherit;outline:none}.field input:focus{border-color:var(--yellow)}.submit{width:100%;margin-top:5px;padding:15px;border:0;border-radius:14px;background:var(--yellow);color:#050505;font:inherit;font-weight:950;cursor:pointer}.submit:disabled{opacity:.6}.message{min-height:20px;margin-top:14px;text-align:center;font-size:12px;color:#ff7373}.hint{text-align:center;color:#666;font-size:11px;line-height:1.5;margin-top:17px}@media(max-width:500px){.card{margin-top:35px;padding:22px}.title{font-size:36px}}
</style></head><body><div class="wrap"><header class="top"><div class="logo">MEANT <b>SHOP</b></div><a class="back" href="visual.html">← Назад</a></header><main class="card"><div class="eyebrow">MEANT ACCOUNT</div><h1 class="title" id="title">ВОЙТИ</h1><div class="subtitle" id="subtitle">Войдите, чтобы открыть профиль и покупать товары.</div><div class="tabs"><button id="loginTab" class="active" onclick="setMode('login')">Войти</button><button id="registerTab" onclick="setMode('register')">Регистрация</button></div><form id="form"><div class="field"><label>Никнейм</label><input id="username" autocomplete="username" minlength="3" maxlength="24" required></div><div class="field"><label>Пароль</label><input id="password" type="password" autocomplete="current-password" minlength="8" maxlength="128" required></div><div class="field" id="confirmWrap" style="display:none"><label>Повторите пароль</label><input id="confirm" type="password" autocomplete="new-password" minlength="8" maxlength="128"></div><button class="submit" id="submit">Войти</button></form><div class="message" id="message"></div><div class="hint">Пароль хранится на сервере в виде PBKDF2-хеша. Не используйте пароль от других сервисов.</div></main></div>
<script>let mode=new URLSearchParams(location.search).get('mode')==='register'?'register':'login';function setMode(m){mode=m;loginTab.classList.toggle('active',m==='login');registerTab.classList.toggle('active',m==='register');title.textContent=m==='login'?'ВОЙТИ':'РЕГИСТРАЦИЯ';subtitle.textContent=m==='login'?'Войдите, чтобы открыть профиль и покупать товары.':'Создайте аккаунт MEANT SHOP за несколько секунд.';submit.textContent=m==='login'?'Войти':'Создать аккаунт';confirmWrap.style.display=m==='register'?'block':'none';confirm.required=m==='register';password.autocomplete=m==='login'?'current-password':'new-password';message.textContent=''}form.addEventListener('submit',async e=>{e.preventDefault();message.textContent='';submit.disabled=true;try{if(mode==='register'&&password.value!==confirm.value)throw new Error('Пароли не совпадают');const r=await fetch('/api/auth/'+mode,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({username:username.value,password:password.value})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Ошибка');localStorage.setItem('meant_account_id',d.account.id);location.href='profile.html'}catch(err){message.textContent=err.message}finally{submit.disabled=false}});fetch('/api/auth/me').then(r=>{if(r.ok)location.href='profile.html'});</script></body></html>

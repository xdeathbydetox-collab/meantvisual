<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MEANT ADMIN — Вход</title>

  <style>
    :root {
      --bg: #070707;
      --card: #101010;
      --card2: #161616;
      --line: #292929;
      --yellow: #ffd21a;
      --yellow2: #ffb900;
      --text: #f7f7f7;
      --muted: #909090;
      --danger: #ff4d4d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(
          circle at 50% 0%,
          rgba(255, 210, 26, 0.08),
          transparent 38%
        ),
        var(--bg);

      color: var(--text);

      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 20px;
    }

    .glow {
      position: fixed;
      width: 420px;
      height: 420px;

      left: 50%;
      top: -260px;

      transform: translateX(-50%);

      background: rgba(255, 210, 26, 0.08);

      filter: blur(120px);
      border-radius: 50%;

      pointer-events: none;
    }

    .container {
      width: 100%;
      max-width: 430px;
    }

    .brand {
      text-align: center;
      margin-bottom: 28px;
    }

    .brand h1 {
      font-size: 32px;
      font-weight: 900;
      letter-spacing: -1.5px;
    }

    .brand h1 span {
      color: var(--yellow);
    }

    .brand p {
      margin-top: 7px;

      color: var(--muted);

      font-size: 12px;
      font-weight: 700;

      letter-spacing: 1.8px;
      text-transform: uppercase;
    }

    .card {
      background: rgba(16, 16, 16, 0.95);

      border: 1px solid var(--line);
      border-radius: 18px;

      padding: 30px;

      box-shadow:
        0 25px 70px rgba(0, 0, 0, 0.55),
        inset 0 1px 0 rgba(255, 255, 255, 0.025);

      backdrop-filter: blur(16px);
    }

    .card h2 {
      font-size: 21px;
      font-weight: 800;
      margin-bottom: 7px;
    }

    .description {
      color: var(--muted);

      font-size: 14px;
      line-height: 1.5;

      margin-bottom: 25px;
    }

    .field {
      margin-bottom: 17px;
    }

    label {
      display: block;

      color: #d7d7d7;

      font-size: 13px;
      font-weight: 700;

      margin-bottom: 8px;
    }

    .input-box {
      position: relative;
    }

    input {
      width: 100%;
      height: 50px;

      border: 1px solid var(--line);
      border-radius: 11px;

      outline: none;

      background: var(--card2);
      color: var(--text);

      padding: 0 15px;

      font-size: 14px;

      transition:
        border-color .2s,
        background .2s,
        box-shadow .2s;
    }

    input::placeholder {
      color: #5f5f5f;
    }

    input:focus {
      border-color: var(--yellow);

      background: #181818;

      box-shadow:
        0 0 0 3px rgba(255, 210, 26, 0.08);
    }

    .password {
      padding-right: 50px;
    }

    .password-toggle {
      position: absolute;

      right: 10px;
      top: 50%;

      transform: translateY(-50%);

      width: 34px;
      height: 34px;

      border: 0;
      border-radius: 8px;

      background: transparent;

      color: #777;

      cursor: pointer;

      font-size: 15px;
    }

    .password-toggle:hover {
      color: var(--yellow);
    }

    .error {
      display: none;

      margin-bottom: 16px;

      padding: 11px 13px;

      border: 1px solid rgba(255, 77, 77, .25);
      border-radius: 10px;

      background: rgba(255, 77, 77, .07);

      color: #ff7777;

      font-size: 13px;
      line-height: 1.4;
    }

    .error.show {
      display: block;
    }

    .login-button {
      width: 100%;
      height: 50px;

      border: 0;
      border-radius: 11px;

      background: var(--yellow);

      color: #080808;

      font-size: 14px;
      font-weight: 900;

      cursor: pointer;

      transition:
        transform .15s,
        background .15s,
        box-shadow .15s;
    }

    .login-button:hover {
      background: var(--yellow2);

      transform: translateY(-1px);

      box-shadow:
        0 8px 25px rgba(255, 210, 26, .15);
    }

    .login-button:active {
      transform: translateY(0);
    }

    .login-button:disabled {
      opacity: .65;
      cursor: wait;
      transform: none;
      box-shadow: none;
    }

    .footer {
      text-align: center;

      color: #555;

      font-size: 12px;

      margin-top: 22px;
    }

    .footer span {
      color: #777;
    }

    @media (max-width: 480px) {
      body {
        padding: 15px;
      }

      .card {
        padding: 23px;
        border-radius: 15px;
      }

      .brand h1 {
        font-size: 28px;
      }
    }
  </style>
</head>

<body>

  <div class="glow"></div>

  <main class="container">

    <div class="brand">
      <h1>
        MEANT <span>ADMIN</span>
      </h1>

      <p>
        Administration Panel
      </p>
    </div>

    <section class="card">

      <h2>
        Вход в панель
      </h2>

      <p class="description">
        Войдите используя логин или email администратора.
      </p>

      <div
        class="error"
        id="error"
      ></div>

      <form id="loginForm">

        <div class="field">

          <label for="login">
            Логин или Email
          </label>

          <div class="input-box">

            <input
              id="login"
              type="text"
              placeholder="Введите логин или email"
              autocomplete="username"
              maxlength="100"
              required
            >

          </div>

        </div>

        <div class="field">

          <label for="password">
            Пароль
          </label>

          <div class="input-box">

            <input
              id="password"
              class="password"
              type="password"
              placeholder="Введите пароль"
              autocomplete="current-password"
              maxlength="200"
              required
            >

            <button
              type="button"
              class="password-toggle"
              id="passwordToggle"
              aria-label="Показать пароль"
            >
              ◉
            </button>

          </div>

        </div>

        <button
          type="submit"
          class="login-button"
          id="loginButton"
        >
          Войти
        </button>

      </form>

    </section>

    <div class="footer">
      © 2026 <span>MEANT ADMIN</span>
    </div>

  </main>

  <script>

    const form =
      document.getElementById("loginForm");

    const loginInput =
      document.getElementById("login");

    const passwordInput =
      document.getElementById("password");

    const passwordToggle =
      document.getElementById("passwordToggle");

    const loginButton =
      document.getElementById("loginButton");

    const errorBox =
      document.getElementById("error");


    /* =========================
       PASSWORD
    ========================= */

    passwordToggle.addEventListener(
      "click",
      () => {

        if (passwordInput.type === "password") {

          passwordInput.type = "text";
          passwordToggle.textContent = "◉";

        } else {

          passwordInput.type = "password";
          passwordToggle.textContent = "◌";

        }

      }
    );


    /* =========================
       ERROR
    ========================= */

    function showError(message) {

      errorBox.textContent = message;
      errorBox.classList.add("show");

    }


    function hideError() {

      errorBox.textContent = "";
      errorBox.classList.remove("show");

    }


    /* =========================
       LOGIN
    ========================= */

    form.addEventListener(
      "submit",
      async (event) => {

        event.preventDefault();

        hideError();

        const login =
          loginInput.value.trim();

        const password =
          passwordInput.value;


        if (!login) {

          showError(
            "Введите логин или email."
          );

          loginInput.focus();

          return;

        }


        if (!password) {

          showError(
            "Введите пароль."
          );

          passwordInput.focus();

          return;

        }


        loginButton.disabled = true;
        loginButton.textContent = "Проверка...";


        try {

          /*
            ВАЖНО:

            Здесь пока нет настоящей
            авторизации.

            Позже подключим:

            POST /api/admin/login

            {
              login,
              password
            }

            Worker проверит:
            - логин/email
            - пароль
            - статус аккаунта
            - email_verified
            - права

            После успешного входа
            создастся защищённая сессия.
          */


          await new Promise(
            resolve => setTimeout(resolve, 700)
          );


          showError(
            "Авторизация ещё не подключена. Следующим этапом подключим сервер MEANT ADMIN."
          );


        } catch (error) {

          console.error(error);

          showError(
            "Не удалось выполнить вход."
          );

        } finally {

          loginButton.disabled = false;
          loginButton.textContent = "Войти";

        }

      }
    );

  </script>

</body>
</html>
